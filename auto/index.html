<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正在為您導向最佳入口…</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root{
      --bg:#020617;
      --card:#020617;
      --accent:#fbbf24;
      --accent-soft:rgba(251,191,36,.16);
      --line:rgba(148,163,184,.45);
      --text:#e5e7eb;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 0 0, rgba(59,130,246,.35), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(251,191,36,.25), transparent 55%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    }
    .shell{
      padding:24px;
      width:min(480px,100%);
    }
    .card{
      position:relative;
      padding:24px 22px 20px;
      border-radius:24px;
      background:radial-gradient(circle at 0 0,rgba(15,23,42,.95),rgba(15,23,42,.98));
      border:1px solid rgba(148,163,184,.45);
      box-shadow:0 18px 60px rgba(15,23,42,.85);
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-120%;
      background:
        linear-gradient(120deg,transparent 0,rgba(251,191,36,.18) 40%,rgba(251,191,36,.35) 50%,rgba(251,191,36,.18) 60%,transparent 100%);
      opacity:.0;
      transform:translateX(-30%);
      pointer-events:none;
      animation:sweep 2.6s linear infinite;
    }
    @keyframes sweep{
      0%{opacity:0;transform:translateX(-40%);}
      15%{opacity:.9;}
      45%{opacity:0;transform:translateX(40%);}
      100%{opacity:0;transform:translateX(40%);}
    }
    .logo-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }
    .logo-mark{
      width:40px;
      height:40px;
      border-radius:16px;
      background:radial-gradient(circle at 30% 0,#1f2937,#020617 70%);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--accent);
      font-weight:900;
      font-size:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.85);
      animation:float 3.2s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-4px);}
    }
    .logo-text{
      font-size:15px;
      line-height:1.3;
    }
    .logo-text strong{
      display:block;
      font-size:16px;
      letter-spacing:.05em;
    }
    h1{
      font-size:20px;
      margin:6px 0 6px;
      color:#f9fafb;
    }
    p{
      font-size:14px;
      line-height:1.7;
      color:#9ca3af;
    }
    .country{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:10px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:13px;
      border:1px solid rgba(251,191,36,.55);
    }
    .country span{white-space:nowrap;}
    .progress-wrap{
      margin-top:18px;
    }
    .bar{
      position:relative;
      height:4px;
      border-radius:999px;
      background:rgba(15,23,42,.8);
      overflow:hidden;
    }
    .bar::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,rgba(148,163,184,.6),var(--accent),rgba(148,163,184,.6));
      transform-origin:0 50%;
      transform:scaleX(.15);
      animation:load 1.8s ease-in-out infinite;
    }
    @keyframes load{
      0%{transform:scaleX(.12) translateX(-10%);}
      50%{transform:scaleX(.9) translateX(10%);}
      100%{transform:scaleX(.12) translateX(110%);}
    }
    .tip{
      margin-top:8px;
      font-size:12px;
      color:#6b7280;
    }
    @media (max-width:480px){
      .shell{padding:16px;}
      .card{padding:20px 16px 18px;}
      h1{font-size:18px;}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card" role="status" aria-live="polite">
      <div class="logo-row">
        <div class="logo-mark">XC</div>
        <div class="logo-text">
          <strong>XC 導流中心</strong>
          <span>正在為你挑選最佳官方入口</span>
        </div>
      </div>
      <h1 id="status">正在為您導向最佳入口…</h1>
      <p>系統會根據你的所在位置與裝置語系，自動分流到最合適的 OFA168 官方站點。</p>
      <div id="countryBadge" class="country" style="display:none;"></div>
      <div class="progress-wrap">
        <div class="bar"></div>
        <div class="tip">通常只需要 1–2 秒，如逾時請重新整理或稍後再試。</div>
      </div>
    </div>
  </div>
<script>
const ENDPOINTS = {
  tw: "https://ag223.gm89.net/login?id=register",
  hk: "https://fbads.ds88hk.net/login?id=register",
  my: "https://fbads.ofa168my.com/login?id=register",
  kh: "https://fbads.ofa88kh.com/login?id=register",
};
const COUNTRY_INFO = {
  tw: { label: "台灣站", flag: "🇹🇼" },
  hk: { label: "香港站", flag: "🇭🇰" },
  my: { label: "馬來西亞站", flag: "🇲🇾" },
  kh: { label: "柬埔寨站", flag: "🇰🇭" },
};
const lang = (navigator.language || "").toLowerCase();
async function detectCountry() {
  try {
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();
    return (data && data.country_code ? data.country_code.toLowerCase() : "");
  } catch (e) {
    return "";
  }
}
function chooseKey(countryCode){
  const c = (countryCode || "").toLowerCase();
  if (c === "tw") return "tw";
  if (c === "hk") return "hk";
  if (c === "my") return "my";
  if (c === "kh") return "kh";

  if (lang.includes("zh") || lang.includes("tw")) return "tw";
  if (lang.includes("hk") || lang.includes("yue")) return "hk";
  if (lang.includes("ms")) return "my";
  if (lang.includes("km")) return "kh";
  return "tw";
}
function redirectTo(key){
  const url = ENDPOINTS[key] || ENDPOINTS.tw;
  setTimeout(() => { window.location.href = url; }, 600);
}
(async () => {
  const country = await detectCountry();
  const key = chooseKey(country);
  const info = COUNTRY_INFO[key] || COUNTRY_INFO.tw;
  const badge = document.getElementById("countryBadge");
  const status = document.getElementById("status");
  if (badge && info){
    badge.style.display = "inline-flex";
    badge.innerHTML = `${info.flag}<span>${info.label}</span>`;
  }
  if (status && info){
    status.textContent = `正在為您導向 ${info.label}…`;
  }
  redirectTo(key);
})();
</script>
</body>
</html>
