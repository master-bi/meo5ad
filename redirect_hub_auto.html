<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>官方入口自動匹配中…</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .auto-wrap{max-width:520px;margin:0 auto;padding:18px}
    .auto-card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px 18px;text-align:center;box-shadow:var(--shadow)}
    .loader{margin:14px auto;width:36px;height:36px;border-radius:50%;border:3px solid rgba(17,24,39,.12);border-top-color:var(--gold);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .muted{color:var(--muted);font-size:14px}
  </style>
</head>
<body>
<div class="auto-wrap">
  <div class="auto-card">
    <div class="badge">官方入口自動分流</div>
    <h2 style="margin:6px 0 4px">正在為你匹配最佳站點</h2>
    <div class="muted">系統會依你的 IP 與語系自動分流，請稍候…</div>
    <div class="loader"></div>
    <div id="status" class="muted">偵測中…</div>
    <button id="manualBtn" class="btn" style="display:none;margin-top:10px">手動選擇站點</button>

    <div id="manualLinks" style="display:none;margin-top:8px;text-align:left" class="muted">
      <div style="margin:6px 0;">台灣：<a href="https://ag223.gm89.net/login?id=register">前往</a></div>
      <div style="margin:6px 0;">香港：<a href="https://fbads.ds88hk.net/login?id=register">前往</a></div>
      <div style="margin:6px 0;">馬來西亞：<a href="https://fbads.ofa168my.com/login?id=register">前往</a></div>
      <div style="margin:6px 0;">柬埔寨：<a href="https://fbads.ofa88kh.com/login?id=register">前往</a></div>
    </div>
  </div>
</div>

<script>
  const DEST = {
    TW: "https://ag223.gm89.net/login?id=register",
    HK: "https://fbads.ds88hk.net/login?id=register",
    MY: "https://fbads.ofa168my.com/login?id=register",
    KH: "https://fbads.ofa88kh.com/login?id=register",
  };
  const DEFAULT_DEST = DEST.TW;

  const params = new URLSearchParams(location.search);
  const force = (params.get("force") || "").toUpperCase();
  const statusEl = document.getElementById("status");
  const manualBtn = document.getElementById("manualBtn");
  const manualLinks = document.getElementById("manualLinks");

  function go(url) {
    statusEl.textContent = "為你跳轉中…";
    setTimeout(() => location.replace(url), 300);
  }
  function showManual() {
    manualBtn.style.display = "inline-flex";
    manualBtn.onclick = () => {
      manualLinks.style.display = manualLinks.style.display === "none" ? "block" : "none";
    };
  }

  async function detectCountry() {
    if (force && DEST[force]) {
      statusEl.textContent = "已使用手動地區：" + force;
      return force;
    }
    try {
      const r = await fetch("https://ipapi.co/json/");
      if (r.ok) {
        const j = await r.json();
        const cc = (j.country_code || "").toUpperCase();
        if (cc) {
          statusEl.textContent = "偵測到 IP 地區：" + cc;
          return cc;
        }
      }
    } catch (e) {}

    const lang = (navigator.language || "").toLowerCase();
    statusEl.textContent = "IP 偵測失敗，改用語系：" + lang;
    if (lang.includes("zh-hk") || lang.includes("yue") || lang.includes("hk")) return "HK";
    if (lang.includes("ms") || lang.includes("my")) return "MY";
    if (lang.includes("km") || lang.includes("kh")) return "KH";
    if (lang.includes("zh") || lang.includes("tw")) return "TW";
    return "";
  }

  (async () => {
    const cc = await detectCountry();
    const url = DEST[cc] || DEFAULT_DEST;
    if (!DEST[cc]) showManual();
    go(url);
  })();
</script>
</body>
</html>
